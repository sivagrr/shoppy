{% extends 'base.html' %}

{% block title %}Update {{ product.name }} | Shoppy{% endblock %}

{% block content %}
<section class="container page-heading">
    <p class="eyebrow">Products</p>
    <h1>Update {{ product.name }}</h1>
    <p class="intro">Edit the product details below.</p>

    <form class="product-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Save changes</button>
        <a class="text-link" href="{% url 'productdetail' product.id %}">Cancel</a>
    </form>
</section>
{% endblock %}
