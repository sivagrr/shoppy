{% extends 'base.html' %}

{% block title %}Delete {{ product.name }} | Shoppy{% endblock %}

{% block content %}
<section class="container page-heading">
    <p class="eyebrow">Products</p>
    <h1>Delete {{ product.name }}?</h1>
    <p class="intro">This will remove the product from the list.</p>

    <form method="post">
        {% csrf_token %}
        <button class="button" type="submit">Yes, delete</button>
        <a class="text-link" href="{% url 'productdetail' product.id %}">Cancel</a>
    </form>
</section>
{% endblock %}
