{% extends "base.html" %}

{% block title %}Add product | Shoppy{% endblock %}

{% block content %}
<section class="container page-heading">
    <h1>Add a product</h1>

    <form class="product-form" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Save product</button>
        <a class="text-link" href="{% url 'products' %}">Cancel</a>
    </form>
</section>
{% endblock %}
